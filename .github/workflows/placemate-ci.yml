name: PlaceMate Continuous Integration (CI)

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

concurrency:
  group: placemate-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install Dependencies Reproducibly
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint Code Quality Checks
        run: npm run lint

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Execute Vitest Automated Test Suite
        run: npm run test:ci

      - name: Verify Next.js Production Build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/placemate"
          JWT_SECRET: "ci_pipeline_test_jwt_secret_key_32_characters_minimum"
